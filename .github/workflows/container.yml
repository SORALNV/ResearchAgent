name: container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - "deploy/**"
      - "harness/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - "deploy/**"
      - "harness/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"

permissions:
  contents: read

jobs:
  build:
    name: container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose contracts
        env:
          WORKER_TOKEN: ci-worker-token
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.local-gpu.yaml config >/dev/null
          docker compose --env-file deploy/.env.worker.example -f deploy/compose.worker.yaml config >/dev/null
          docker compose --env-file deploy/.env.worker.example -f deploy/compose.worker.yaml -f deploy/compose.worker-gpu.yaml config >/dev/null
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            INSTALL_CODEX=false
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
