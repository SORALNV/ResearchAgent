name: patch-codex-v2-test

on:
  push:
    branches:
      - fix/codex-app-server-v2-conformance
    paths:
      - ".github/workflows/patch-codex-v2-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-app-server-v2-conformance
      - name: Align the existing regression test with generated v2 UserInput
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/textElements/text_elements/g' tests/test_codex_app_server_runtime.py
          rm .github/workflows/patch-codex-v2-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_codex_app_server_runtime.py .github/workflows/patch-codex-v2-test.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: align existing App Server regression with v2 schema'
          git push origin HEAD:fix/codex-app-server-v2-conformance
