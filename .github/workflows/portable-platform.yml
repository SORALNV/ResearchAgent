name: portable-platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install portable dependencies
        run: |
          python -m pip install -r requirements-platform.txt
          python -m pip install --no-deps -e .
      - name: Compile all Python modules
        run: python -m compileall -q harness main.py sitecustomize.py
      - name: Test full suite
        run: pytest -q
      - name: Validate secure Compose files
        run: |
          cp deploy/.env.core.example deploy/.env.core
          cp deploy/.env.edge.example deploy/.env.edge
          cp deploy/.env.worker.example deploy/.env.worker
          docker compose -f deploy/compose.core-edge.yaml config >/dev/null
          docker compose -f deploy/compose.edge.yaml config >/dev/null
          docker compose -f deploy/compose.worker.yaml -f deploy/compose.worker-gpu.yaml config >/dev/null

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 and AMD64 Edge
        uses: docker/build-push-action@v6
        with:
          context: .
          target: edge
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
      - name: Build AMD64 Core
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          build-args: |
            INSTALL_COMPUTER_USE=false
      - name: Build AMD64 Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
