services:
  core:
    environment:
      REMOTE_GPU_WORKER_NAME: local_gpu_worker
      REMOTE_GPU_WORKER_URL: http://local-gpu-worker:8090
      REMOTE_GPU_WORKER_TOKEN: ${LOCAL_GPU_WORKER_TOKEN:?LOCAL_GPU_WORKER_TOKEN is required}
      REMOTE_GPU_WORKER_PAID: "false"
      REMOTE_GPU_WORKER_GPU_COUNT: ${LOCAL_GPU_COUNT:-1}
      REMOTE_GPU_WORKER_GPU_MEMORY_MB: ${LOCAL_GPU_MEMORY_MB:-}
      REMOTE_GPU_WORKER_NETWORK_AVAILABLE: ${LOCAL_GPU_WORKER_NETWORK_AVAILABLE:-false}
      REMOTE_GPU_WORKER_LABELS: ${LOCAL_GPU_WORKER_LABELS:-training,inference,remote_worker,smoke_test}
      COMPUTE_RESEARCH_BACKEND_ORDER: ${COMPUTE_RESEARCH_BACKEND_ORDER:-local_gpu_worker,remote_gpu}
      COMPUTE_KAGGLE_BACKEND_ORDER: ${COMPUTE_KAGGLE_BACKEND_ORDER:-kaggle_notebook,local_gpu_worker,remote_gpu}
    depends_on:
      local-gpu-worker:
        condition: service_healthy

  local-gpu-worker:
    image: ${RESEARCH_AGENT_IMAGE:-research-agent:local}
    restart: unless-stopped
    environment:
      RESEARCH_AGENT_ROLE: worker
      WORKER_TOKEN: ${LOCAL_GPU_WORKER_TOKEN:?LOCAL_GPU_WORKER_TOKEN is required}
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 8090
      WORKER_DATA_DIR: /data/worker
      WORKER_ACCELERATORS: cpu,gpu
      WORKER_DOMAINS: research,kaggle
      WORKER_GPU_COUNT: ${LOCAL_GPU_COUNT:-1}
      WORKER_GPU_MEMORY_MB: ${LOCAL_GPU_MEMORY_MB:-}
      WORKER_CPU_CORES: ${LOCAL_GPU_MAX_CPU_CORES:-}
      WORKER_MEMORY_MB: ${LOCAL_GPU_MAX_MEMORY_MB:-}
      WORKER_STORAGE_MB: ${LOCAL_GPU_MAX_STORAGE_MB:-}
      WORKER_NETWORK_AVAILABLE: ${LOCAL_GPU_WORKER_NETWORK_AVAILABLE:-false}
      WORKER_LABELS: ${LOCAL_GPU_WORKER_LABELS:-training,inference,remote_worker,smoke_test}
      WORKER_MAX_BUNDLE_FILES: ${WORKER_MAX_BUNDLE_FILES:-5000}
      WORKER_MAX_BUNDLE_BYTES: ${WORKER_MAX_BUNDLE_BYTES:-67108864}
      WORKER_ARTIFACT_MAX_FILES: ${WORKER_ARTIFACT_MAX_FILES:-2000}
      WORKER_ARTIFACT_MAX_BYTES: ${WORKER_ARTIFACT_MAX_BYTES:-4294967296}
      WORKER_MAX_REQUEST_BYTES: ${WORKER_MAX_REQUEST_BYTES:-100663296}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - python
      - -m
      - harness.compute_worker
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --data-dir
      - /data/worker
    volumes:
      - ${RA_LOCAL_GPU_WORKER_RUNTIME_DIR:-./local-gpu-worker-runtime}:/data/worker
    gpus: all
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /home/researchagent:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5
    stop_grace_period: 45s
