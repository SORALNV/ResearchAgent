name: finalize-discord-execution-threads

on:
  push:
    branches:
      - feat/discord-execution-threads
    paths:
      - .github/workflows/finalize-discord-execution-threads.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-execution-threads
          fetch-depth: 0
      - name: Apply marker-based follow-up fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          def read(relative: str) -> str:
              return (root / relative).read_text(encoding="utf-8")

          def write(relative: str, text: str) -> None:
              (root / relative).write_text(text, encoding="utf-8")

          def replace_range(
              relative: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              text = read(relative)
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f"start marker missing in {relative}: {start_marker!r}")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise RuntimeError(f"end marker missing in {relative}: {end_marker!r}")
              write(relative, text[:start] + replacement + text[end:])

          def replace_once(relative: str, old: str, new: str) -> None:
              text = read(relative)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one marker in {relative}, found {count}: {old[:100]!r}"
                  )
              write(relative, text.replace(old, new, 1))

          replace_range(
              "harness/discord_execution_ui.py",
              "def format_job_progress(",
              "def job_is_terminal(",
              '''def _runtime_progress(runtime: Any | None) -> tuple[str, float | None]:
              handle = getattr(runtime, "handle", None) if runtime is not None else None
              stage = str(getattr(handle, "stage", "") or "")
              raw_progress = getattr(handle, "progress", None)
              try:
                  progress = float(raw_progress) if raw_progress is not None else None
              except (TypeError, ValueError):
                  progress = None
              if progress is not None:
                  progress = min(1.0, max(0.0, progress))
              return stage, progress


          def format_job_progress(job: Any, *, runtime: Any | None = None) -> str:
              status = str(
                  getattr(
                      getattr(job, "status", None),
                      "value",
                      getattr(job, "status", "unknown"),
                  )
              )
              backend = str(getattr(job, "backend_id", None) or "-")
              error = " ".join(str(getattr(job, "error", "") or "").split())[:600]
              result_ref = str(getattr(job, "checkpoint_ref", None) or "")
              stage, progress = _runtime_progress(runtime)
              message = f"**Job更新:** `{job.job_id}` → **{status}** · backend `{backend}`"
              if stage:
                  message += f" · stage `{stage}`"
              if progress is not None:
                  message += f" · `{progress * 100:.0f}%`"
              if result_ref:
                  message += f" · result `{result_ref}`"
              if error:
                  message += f"\n**理由:** {error}"
              return message


          def job_progress_key(
              job: Any,
              *,
              runtime: Any | None = None,
          ) -> tuple[str, str, str, str, str, str]:
              stage, progress = _runtime_progress(runtime)
              return (
                  str(
                      getattr(
                          getattr(job, "status", None),
                          "value",
                          getattr(job, "status", ""),
                      )
                  ),
                  str(getattr(job, "backend_id", None) or ""),
                  str(getattr(job, "checkpoint_ref", None) or ""),
                  str(getattr(job, "error", None) or ""),
                  stage,
                  "" if progress is None else f"{progress:.4f}",
              )


          ''',
          )

          replace_range(
              "harness/natural_channel_discord.py",
              "                    # Recheck after lock acquisition so a closely arriving message\n",
              "                    async with progress_target.typing():\n",
              '''                    # Ordinary follow-ups may steer a running turn. Explicit
                                  # execution requests wait for the channel lock and start their own
                                  # natural-action turn so the Job/final-action contract is preserved.
                                  steered = None
                                  if not action_message:
                                      steered = await asyncio.to_thread(
                                          self.service.try_steer_codex,
                                          location,
                                          message_id=str(message.id),
                                          actor_id=str(message.author.id),
                                          text=str(message.content),
                                          title=title,
                                      )
                                  if steered is not None:
                                      await send_chunks(
                                          message.channel,
                                          f"**途中指示を反映しました。** turn `{steered.turn_id}`",
                                      )
                                      return
              ''',
          )

          adapter = read("harness/natural_channel_discord.py")
          terminal_marker = (
              "                        execution_registry.set_status(thread_id, final_status)\n"
          )
          if "session_targets.pop(record.work_session_id, None)" not in adapter:
              if adapter.count(terminal_marker) != 1:
                  raise RuntimeError("terminal execution-thread marker is not unique")
              adapter = adapter.replace(
                  terminal_marker,
                  terminal_marker
                  + "                        if session_targets.get(record.work_session_id) is target:\n"
                  + "                            session_targets.pop(record.work_session_id, None)\n",
                  1,
              )

          no_job_marker = '''                        if execution_record is not None and not new_job_ids:
                                      execution_registry.set_status(
                                          execution_record.thread_id,
                                          "completed",
                                      )
          '''
          if "session_targets.get(channel.work_session_id) is progress_target" not in adapter:
              if adapter.count(no_job_marker) != 1:
                  raise RuntimeError("no-job execution-thread marker is not unique")
              adapter = adapter.replace(
                  no_job_marker,
                  no_job_marker
                  + "                            if session_targets.get(channel.work_session_id) is progress_target:\n"
                  + "                                session_targets.pop(channel.work_session_id, None)\n",
                  1,
              )
          write("harness/natural_channel_discord.py", adapter)

          replace_range(
              "harness/natural_channel_service_v2.py",
              "_RUN_RE = re.compile(\n",
              "_SUBMIT_RE = re.compile(\n",
              '''_RUN_RE = re.compile(
              r"(?:実装(?:して|する|しよう)|実行(?:して|する|しよう)|回して|試して|"
              r"やって(?:みて|ください|くれ)?|進めて|開始して|採用(?:して|する)|"
              r"(?:改修|修正|追加|変更|更新|作成|導入|反映|適用|統合|マージ|コミット|プッシュ)"
              r"(?:して|してください|してほしい|をお願い(?:します)?)|直して|取り込んで|作って|"
              r"この案で|これで(?:行こう|いこう)|run\\b|execute\\b|try\\b|"
              r"fix\\b|update\\b|implement\\b|build\\b|apply\\b|merge\\b|commit\\b|push\\b)",
              re.IGNORECASE,
          )
          ''',
          )

          workflow_test = read("tests/test_natural_channel_workflow.py")
          if "このリポジトリを改修して" not in workflow_test:
              marker = '    assert _explicit_run_intent("まだ実行しないで") is False\n'
              if workflow_test.count(marker) != 1:
                  raise RuntimeError("run-intent test marker is not unique")
              workflow_test = workflow_test.replace(
                  marker,
                  marker
                  + '    assert _explicit_run_intent("このリポジトリを改修して") is True\n'
                  + '    assert _explicit_run_intent("origin/mainを--ff-onlyで取り込んで") is True\n'
                  + '    assert _explicit_run_intent("修正する必要がありますか？") is False\n',
                  1,
              )
          write("tests/test_natural_channel_workflow.py", workflow_test)

          ui_test = read("tests/test_discord_execution_ui.py")
          old_assert = '    assert "local_gpu_worker" in format_job_progress(succeeded)\n'
          if "handle=SimpleNamespace(stage=\"training\", progress=0.42)" not in ui_test:
              if ui_test.count(old_assert) != 1:
                  raise RuntimeError("job-progress test marker is not unique")
              ui_test = ui_test.replace(
                  old_assert,
                  '    runtime = SimpleNamespace(\n'
                  '        handle=SimpleNamespace(stage="training", progress=0.42)\n'
                  '    )\n'
                  '    progress = format_job_progress(succeeded, runtime=runtime)\n'
                  '    assert "local_gpu_worker" in progress\n'
                  '    assert "training" in progress\n'
                  '    assert "42%" in progress\n',
                  1,
              )
          static_marker = '    assert "message.create_thread" in adapter\n'
          if '    assert "if not action_message" in adapter\n' not in ui_test:
              if ui_test.count(static_marker) != 1:
                  raise RuntimeError("adapter static-test marker is not unique")
              ui_test = ui_test.replace(
                  static_marker,
                  static_marker
                  + '    assert "if not action_message" in adapter\n'
                  + '    assert "session_targets.pop" in adapter\n',
                  1,
              )
          write("tests/test_discord_execution_ui.py", ui_test)

          (root / ".github/workflows/finalize-discord-execution-threads.yml").unlink()
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q harness main.py
      - name: Test
        run: pytest -q
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(discord): finalize execution thread routing and progress"
          git push origin HEAD:feat/discord-execution-threads
