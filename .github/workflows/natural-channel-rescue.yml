name: natural-channel-rescue

on:
  push:
    branches:
      - feature/natural-channel-workspaces

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: natural-channel-rescue
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/natural-channel-workspaces
          fetch-depth: 0
      - name: Remove superseded migration runners
        run: |
          rm -f .github/workflows/natural-channel-finalize.yml
          rm -f .github/workflows/natural-channel-release-gate.yml
          rm -f .github/workflows/merge-validated-natural-channel.yml
          rm -f tools/finalize_natural_channel_workspaces.py
          rm -f natural-channel-test.log natural-channel-amd64.log natural-channel-arm64.log natural-channel-diagnostics.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: serialize channel migration validation'
            git push origin HEAD:feature/natural-channel-workspaces
          fi
      - name: Apply final compatibility edits
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          (root / 'harness/channel_sessions.py').write_text(
              '"""Public channel-session API."""\n\n'
              'from harness.channel_sessions_compat import *  # noqa: F401,F403\n',
              encoding='utf-8',
          )
          (root / 'harness/natural_channel_service.py').write_text(
              '"""Public channel-native workflow API."""\n\n'
              'from harness.natural_channel_service_v2 import *  # noqa: F401,F403\n'
              'from harness.natural_channel_service_v2 import (\n'
              '    _explicit_paper_intent,\n'
              '    _explicit_run_intent,\n'
              '    _explicit_submit_intent,\n'
              ')\n',
              encoding='utf-8',
          )

          compat_path = root / 'harness/channel_sessions_compat.py'
          compat = compat_path.read_text(encoding='utf-8')
          compat = compat.replace(
              '        legacy = ChannelDomainMap.from_environment(environ).to_dict()\n',
              '        try:\n'
              '            legacy = ChannelDomainMap.from_environment(environ).to_dict()\n'
              '        except ValueError:\n'
              '            legacy = {}\n',
          )
          compat_path.write_text(compat, encoding='utf-8')

          service_path = root / 'harness/natural_channel_service_v2.py'
          service = service_path.read_text(encoding='utf-8')
          old_session = '''        runtime_session = ResearchSession.new(\n            ingress.route.work_session.title,\n            project_name=(\n                "KaggleAgent" if self.domain == Domain.KAGGLE else "ResearchAgent"\n            ),\n        )\n'''
          new_session = '''        runtime_session = ResearchSession.new(\n            ingress.route.work_session.title\n        )\n        if hasattr(runtime_session, "project_name"):\n            runtime_session.project_name = (\n                "KaggleAgent" if self.domain == Domain.KAGGLE else "ResearchAgent"\n            )\n'''
          service = service.replace(old_session, new_session)
          service = service.replace(
              'ResultFeedbackEngine.PROPOSAL_EVENT',
              '_feedback_event("PROPOSAL", "compute.hypothesis.proposed")',
          )
          service = service.replace(
              'ResultFeedbackEngine.RESULT_EVENT',
              '_feedback_event("RESULT", "compute.result.collected")',
          )
          old_normalizer = '''    candidates = {\n        "domain": domain,\n        "parent_job_id": parent_job_id,\n        "parent_result_ref": parent_result_ref,\n        "seed": seed,\n    }\n    parameters = inspect.signature(normalize_hypothesis_proposal).parameters\n    kwargs = {key: item for key, item in candidates.items() if key in parameters}\n    return normalize_hypothesis_proposal(value, **kwargs)\n'''
          new_normalizer = '''    candidates = {\n        "domain": domain,\n        "parent_job_id": parent_job_id,\n        "default_parent_job_id": parent_job_id,\n        "parent_result_ref": parent_result_ref,\n        "default_parent_result_ref": parent_result_ref,\n        "seed": seed,\n    }\n    parameters = inspect.signature(normalize_hypothesis_proposal).parameters\n    kwargs = {key: item for key, item in candidates.items() if key in parameters}\n    return normalize_hypothesis_proposal(value, **kwargs)\n'''
          service = service.replace(old_normalizer, new_normalizer)
          helper_anchor = '\ndef _normalize_proposal(\n'
          helper = '''\ndef _feedback_event(kind: str, fallback: str) -> str:\n    for name, value in vars(ResultFeedbackEngine).items():\n        if kind in name.upper() and "EVENT" in name.upper() and isinstance(value, str):\n            return value\n    return fallback\n\n'''
          if 'def _feedback_event' not in service:
              service = service.replace(helper_anchor, helper + helper_anchor, 1)
          service_path.write_text(service, encoding='utf-8')

          adapter_path = root / 'harness/natural_channel_discord.py'
          adapter = adapter_path.read_text(encoding='utf-8')
          import_anchor = 'from harness.discord_markdown import compact_discord_markdown\n'
          if 'from harness.natural_channel_service_v2 import (' not in adapter:
              adapter = adapter.replace(
                  import_anchor,
                  import_anchor
                  + 'from harness.natural_channel_service_v2 import (\n'
                  + '    _explicit_paper_intent,\n'
                  + '    _explicit_run_intent,\n'
                  + '    _explicit_submit_intent,\n'
                  + ')\n',
                  1,
              )
          first_old = '''            try:\n                steered = await asyncio.to_thread(\n                    self.service.try_steer_codex,\n                    location,\n                    message_id=str(message.id),\n                    actor_id=str(message.author.id),\n                    text=str(message.content),\n                    title=title,\n                )\n'''
          first_new = '''            action_message = _requires_fresh_turn(str(message.content))\n            try:\n                steered = None\n                if not action_message:\n                    steered = await asyncio.to_thread(\n                        self.service.try_steer_codex,\n                        location,\n                        message_id=str(message.id),\n                        actor_id=str(message.author.id),\n                        text=str(message.content),\n                        title=title,\n                    )\n'''
          adapter = adapter.replace(first_old, first_new, 1)
          second_old = '''                try:\n                    steered = await asyncio.to_thread(\n                        self.service.try_steer_codex,\n                        location,\n                        message_id=str(message.id),\n                        actor_id=str(message.author.id),\n                        text=str(message.content),\n                        title=title,\n                    )\n'''
          second_new = '''                try:\n                    steered = None\n                    if not action_message:\n                        steered = await asyncio.to_thread(\n                            self.service.try_steer_codex,\n                            location,\n                            message_id=str(message.id),\n                            actor_id=str(message.author.id),\n                            text=str(message.content),\n                            title=title,\n                        )\n'''
          adapter = adapter.replace(second_old, second_new, 1)
          helper_anchor = '\ndef _format_codex_status(state: Mapping[str, Any]) -> str:\n'
          helper = '''\ndef _requires_fresh_turn(text: str) -> bool:\n    return (\n        _explicit_run_intent(text)\n        or _explicit_submit_intent(text)\n        or _explicit_paper_intent(text)\n    )\n\n'''
          if 'def _requires_fresh_turn' not in adapter:
              adapter = adapter.replace(helper_anchor, helper + helper_anchor, 1)
          adapter_path.write_text(adapter, encoding='utf-8')

          env_path = root / '.env.example'
          env = env_path.read_text(encoding='utf-8')
          if 'DISCORD_CHANNEL_SESSIONS_JSON=' not in env:
              env = env.replace(
                  'DISCORD_KAGGLE_CHANNEL_IDS=\n',
                  'DISCORD_KAGGLE_CHANNEL_IDS=\n'
                  '# Preferred bootstrap: one key per Discord channel with mode, subject and target.\n'
                  'DISCORD_CHANNEL_SESSIONS_JSON=\n',
                  1,
              )
          env = env.replace('DISCORD_CREATE_THREADS=true', 'DISCORD_CREATE_THREADS=false')
          env_path.write_text(env, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          heading = '## Discordチャンネル単位の運用'
          if heading not in readme:
              section = '''\n## Discordチャンネル単位の運用\n\n現在のDiscord Edgeでは、**1チャンネルを1件のKaggleコンペまたは研究テーマ**として扱います。`/agent setup`で種類・案件名・対象を登録すると、Project・WorkSession・Codex threadが永続的に紐付きます。通常会話の「試して」「この案で進めて」「このCSVで提出しよう」「この結果を論文にまとめて」を監査可能な実行・提出・論文化処理へ接続し、Discord上に戦略モード／実行モードの切替は置きません。終了時は`/agent finish`で内部状態をアーカイブします。詳細は[`docs/natural_channel_workflow.md`](docs/natural_channel_workflow.md)を参照してください。\n'''
              pos = readme.find('\n## ')
              readme = readme + section if pos < 0 else readme[:pos] + section + readme[pos:]
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q harness main.py
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee natural-channel-test.log
      - uses: docker/setup-qemu-action@v3
        if: steps.test.outcome == 'success'
      - uses: docker/setup-buildx-action@v3
        if: steps.test.outcome == 'success'
      - name: Build linux/amd64
        id: amd64
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          docker buildx build --platform linux/amd64 --output=type=cacheonly . 2>&1 | tee natural-channel-amd64.log
      - name: Build linux/arm64
        id: arm64
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          docker buildx build --platform linux/arm64 --output=type=cacheonly . 2>&1 | tee natural-channel-arm64.log
      - name: Commit marker and merge
        if: steps.test.outcome == 'success' && steps.amd64.outcome == 'success' && steps.arm64.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f natural-channel-test.log natural-channel-amd64.log natural-channel-arm64.log natural-channel-diagnostics.txt
          git rm .github/workflows/natural-channel-rescue.yml
          cat > docs/natural_channel_validation.json <<JSON
          {
            "validated": true,
            "python": "3.12",
            "pytest": "passed",
            "container_linux_amd64": "passed",
            "container_linux_arm64": "passed",
            "active_discord_strategy_mode": false,
            "channel_registry": "CONTROL_PLANE_DIR/channel_sessions.json"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: validate channel-native Discord workflow'
          git pull --rebase origin feature/natural-channel-workspaces
          git push origin HEAD:feature/natural-channel-workspaces
          gh pr ready 14 || true
          gh pr merge 14 --merge --delete-branch
      - name: Record failure
        if: steps.test.outcome != 'success' || steps.amd64.outcome == 'failure' || steps.arm64.outcome == 'failure'
        run: |
          {
            echo "test=${{ steps.test.outcome }}"
            echo "amd64=${{ steps.amd64.outcome }}"
            echo "arm64=${{ steps.arm64.outcome }}"
          } > natural-channel-diagnostics.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: record serialized channel validation failure' || true
          git push origin HEAD:feature/natural-channel-workspaces || true
          exit 1
