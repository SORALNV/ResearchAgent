[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-harness"
version = "0.2.0"
description = "Portable research and Kaggle agent control plane with Discord, Codex, OpenAI providers, checkpoints, and approval gates."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.4"]
openai = ["openai>=1.66.0"]
kaggle = ["kaggle>=2,<3"]
runtime = ["discord.py>=2.4", "openai>=1.66.0", "kaggle>=2,<3"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["harness"]
