name: apply-discord-execution-threads

on:
  push:
    branches:
      - feat/discord-execution-threads
    paths:
      - tools/discord_execution_threads.patch
      - .github/workflows/apply-discord-execution-threads.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-execution-threads
          fetch-depth: 0
      - name: Apply source patch
        run: |
          git apply --check tools/discord_execution_threads.patch
          git apply tools/discord_execution_threads.patch
          rm tools/discord_execution_threads.patch
          rm .github/workflows/apply-discord-execution-threads.yml
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(discord): add execution progress threads and operator commands"
          git push origin HEAD:feat/discord-execution-threads
