name: merge-validated-natural-channel

on:
  push:
    branches:
      - feature/natural-channel-workspaces

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-validated-natural-channel
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/natural-channel-workspaces
          fetch-depth: 0
      - name: Require release-gate marker
        run: |
          test -f docs/natural_channel_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('docs/natural_channel_validation.json').read_text())
          required = (
              value.get('validated') is True,
              value.get('pytest') == 'passed',
              value.get('container_linux_amd64') == 'passed',
              value.get('container_linux_arm64') == 'passed',
              value.get('active_discord_strategy_mode') is False,
          )
          if not all(required):
              raise SystemExit('validation marker is incomplete')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Recheck Python suite
        run: |
          python -m pip install -e '.[test]'
          python -m compileall -q harness main.py
          pytest -q
      - name: Remove temporary migration files and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/natural-channel-finalize.yml
          rm -f .github/workflows/natural-channel-release-gate.yml
          rm -f tools/finalize_natural_channel_workspaces.py
          rm -f natural-channel-test.log natural-channel-amd64.log natural-channel-arm64.log natural-channel-diagnostics.txt
          git rm .github/workflows/merge-validated-natural-channel.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove channel migration gates'
          git pull --rebase origin feature/natural-channel-workspaces
          git push origin HEAD:feature/natural-channel-workspaces
          gh pr ready 14 || true
          gh pr merge 14 --merge --delete-branch
