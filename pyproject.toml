[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-harness"
version = "0.2.0"
description = "Portable ResearchAgent and KaggleAgent control plane with Discord threads and pluggable compute."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.4"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
computer = ["playwright>=1.50"]
platform = [
  "discord.py>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
test = [
  "pytest>=8.0",
  "fastapi>=0.115",
  "httpx>=0.27",
]

[project.scripts]
research-agent-core = "harness.platform.api:main"
research-agent-edge = "harness.platform.discord_edge:main"
research-agent-worker = "harness.compute.worker_api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
