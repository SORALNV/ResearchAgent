name: finalize-discord-execution-threads

on:
  push:
    branches:
      - feat/discord-execution-threads
    paths:
      - .github/workflows/finalize-discord-execution-threads.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-execution-threads
          fetch-depth: 0
      - name: Apply validated follow-up fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one marker in {relative}, found {count}: {old[:100]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "harness/discord_execution_ui.py",
              '''def format_job_progress(job: Any) -> str:
              status = str(getattr(getattr(job, "status", None), "value", getattr(job, "status", "unknown")))
              backend = str(getattr(job, "backend_id", None) or "-")
              error = " ".join(str(getattr(job, "error", "") or "").split())[:600]
              result_ref = str(getattr(job, "checkpoint_ref", None) or "")
              message = f"**Job更新:** `{job.job_id}` → **{status}** · backend `{backend}`"
              if result_ref:
                  message += f" · result `{result_ref}`"
              if error:
                  message += f"\n**理由:** {error}"
              return message


          def job_progress_key(job: Any) -> tuple[str, str, str, str]:
              return (
                  str(getattr(getattr(job, "status", None), "value", getattr(job, "status", ""))),
                  str(getattr(job, "backend_id", None) or ""),
                  str(getattr(job, "checkpoint_ref", None) or ""),
                  str(getattr(job, "error", None) or ""),
              )
          ''',
              '''def _runtime_progress(runtime: Any | None) -> tuple[str, float | None]:
              handle = getattr(runtime, "handle", None) if runtime is not None else None
              stage = str(getattr(handle, "stage", "") or "")
              raw_progress = getattr(handle, "progress", None)
              try:
                  progress = float(raw_progress) if raw_progress is not None else None
              except (TypeError, ValueError):
                  progress = None
              if progress is not None:
                  progress = min(1.0, max(0.0, progress))
              return stage, progress


          def format_job_progress(job: Any, *, runtime: Any | None = None) -> str:
              status = str(getattr(getattr(job, "status", None), "value", getattr(job, "status", "unknown")))
              backend = str(getattr(job, "backend_id", None) or "-")
              error = " ".join(str(getattr(job, "error", "") or "").split())[:600]
              result_ref = str(getattr(job, "checkpoint_ref", None) or "")
              stage, progress = _runtime_progress(runtime)
              message = f"**Job更新:** `{job.job_id}` → **{status}** · backend `{backend}`"
              if stage:
                  message += f" · stage `{stage}`"
              if progress is not None:
                  message += f" · `{progress * 100:.0f}%`"
              if result_ref:
                  message += f" · result `{result_ref}`"
              if error:
                  message += f"\n**理由:** {error}"
              return message


          def job_progress_key(
              job: Any,
              *,
              runtime: Any | None = None,
          ) -> tuple[str, str, str, str, str, str]:
              stage, progress = _runtime_progress(runtime)
              return (
                  str(getattr(getattr(job, "status", None), "value", getattr(job, "status", ""))),
                  str(getattr(job, "backend_id", None) or ""),
                  str(getattr(job, "checkpoint_ref", None) or ""),
                  str(getattr(job, "error", None) or ""),
                  stage,
                  "" if progress is None else f"{progress:.4f}",
              )
          ''',
          )

          replace_once(
              "harness/natural_channel_discord.py",
              '''                    # Recheck after lock acquisition so a closely arriving message
                                  # becomes official turn/steer input rather than a queued turn.
                                  steered = await asyncio.to_thread(
                                      self.service.try_steer_codex,
                                      location,
                                      message_id=str(message.id),
                                      actor_id=str(message.author.id),
                                      text=str(message.content),
                                      title=title,
                                  )
                                  if steered is not None:
                                      await send_chunks(
                                          message.channel,
                                          f"**途中指示を反映しました。** turn `{steered.turn_id}`",
                                      )
                                      return
              ''',
              '''                    # Ordinary follow-ups may steer a running turn. Explicit
                                  # execution requests wait for the channel lock and start their own
                                  # natural-action turn so the Job/final-action contract is preserved.
                                  steered = None
                                  if not action_message:
                                      steered = await asyncio.to_thread(
                                          self.service.try_steer_codex,
                                          location,
                                          message_id=str(message.id),
                                          actor_id=str(message.author.id),
                                          text=str(message.content),
                                          title=title,
                                      )
                                  if steered is not None:
                                      await send_chunks(
                                          message.channel,
                                          f"**途中指示を反映しました。** turn `{steered.turn_id}`",
                                      )
                                      return
              ''',
          )

          replace_once(
              "harness/natural_channel_discord.py",
              '''                        execution_registry.set_status(thread_id, final_status)
                      except Exception as exc:
              ''',
              '''                        execution_registry.set_status(thread_id, final_status)
                                  if session_targets.get(record.work_session_id) is target:
                                      session_targets.pop(record.work_session_id, None)
                      except Exception as exc:
              ''',
          )

          replace_once(
              "harness/natural_channel_discord.py",
              '''                        if execution_record is not None and not new_job_ids:
                                          execution_registry.set_status(
                                              execution_record.thread_id,
                                              "completed",
                                          )
              ''',
              '''                        if execution_record is not None and not new_job_ids:
                                          execution_registry.set_status(
                                              execution_record.thread_id,
                                              "completed",
                                          )
                                          if session_targets.get(channel.work_session_id) is progress_target:
                                              session_targets.pop(channel.work_session_id, None)
              ''',
          )

          replace_once(
              "harness/natural_channel_service_v2.py",
              '''_RUN_RE = re.compile(
              r"(?:実装(?:して|する|しよう)|実行(?:して|する|しよう)|回して|試して|"
              r"やって(?:みて|ください|くれ)?|進めて|開始して|採用(?:して|する)|"
              r"この案で|これで(?:行こう|いこう)|run\\b|execute\\b|try\\b)",
              re.IGNORECASE,
          )
              ''',
              '''_RUN_RE = re.compile(
              r"(?:実装(?:して|する|しよう)|実行(?:して|する|しよう)|回して|試して|"
              r"やって(?:みて|ください|くれ)?|進めて|開始して|採用(?:して|する)|"
              r"(?:改修|修正|追加|変更|更新|作成|導入|反映|適用|統合|マージ|コミット|プッシュ)"
              r"(?:して|してください|してほしい|をお願い(?:します)?)|直して|取り込んで|作って|"
              r"この案で|これで(?:行こう|いこう)|run\\b|execute\\b|try\\b|"
              r"fix\\b|update\\b|implement\\b|build\\b|apply\\b|merge\\b|commit\\b|push\\b)",
              re.IGNORECASE,
          )
              ''',
          )

          replace_once(
              "tests/test_natural_channel_workflow.py",
              '''    assert _explicit_run_intent("まだ実行しないで") is False
              assert _explicit_submit_intent("このCSVで提出しよう") is True
              ''',
              '''    assert _explicit_run_intent("まだ実行しないで") is False
              assert _explicit_run_intent("このリポジトリを改修して") is True
              assert _explicit_run_intent("origin/mainを--ff-onlyで取り込んで") is True
              assert _explicit_run_intent("修正する必要がありますか？") is False
              assert _explicit_submit_intent("このCSVで提出しよう") is True
              ''',
          )

          replace_once(
              "tests/test_discord_execution_ui.py",
              '''    assert job_is_terminal(running) is False
              assert job_is_terminal(succeeded) is True
              assert "local_gpu_worker" in format_job_progress(succeeded)
              ''',
              '''    assert job_is_terminal(running) is False
              assert job_is_terminal(succeeded) is True
              runtime = SimpleNamespace(
                  handle=SimpleNamespace(stage="training", progress=0.42)
              )
              progress = format_job_progress(succeeded, runtime=runtime)
              assert "local_gpu_worker" in progress
              assert "training" in progress
              assert "42%" in progress
              ''',
          )

          replace_once(
              "tests/test_discord_execution_ui.py",
              '''    assert "message.create_thread" in adapter
              assert "DISCORD_EXECUTION_THREADS" in (
              ''',
              '''    assert "message.create_thread" in adapter
              assert "if not action_message" in adapter
              assert "session_targets.pop" in adapter
              assert "DISCORD_EXECUTION_THREADS" in (
              ''',
          )

          (root / ".github/workflows/finalize-discord-execution-threads.yml").unlink()
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q harness main.py
      - name: Test
        run: pytest -q
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(discord): finalize execution thread routing and progress"
          git push origin HEAD:feat/discord-execution-threads
